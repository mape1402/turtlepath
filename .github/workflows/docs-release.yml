name: Documentation Release

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'docs/guides/template/**'
      - 'eng/Update-TemplateGuideManifest.ps1'
      - '.github/workflows/docs-release.yml'
      - '.docs.release'
      - '.template.release'
      - 'DOCS_CHANGELOG.md'
  push:
    branches:
      - main
    paths:
      - 'docs/guides/template/**'
      - 'eng/Update-TemplateGuideManifest.ps1'
      - '.github/workflows/docs-release.yml'
      - '.docs.release'
      - '.template.release'
      - 'DOCS_CHANGELOG.md'

env:
  CHANGELOG_PATH: DOCS_CHANGELOG.md
  RELEASE_MARKER_PATH: .docs.release
  RELEASE_NOTES_PATH: docs_release_notes.txt
  RELEASE_BRANCH_PREFIX: docs-releases/
  RELEASE_BRANCH_PATTERN: ^docs-releases/docs-v[0-9]+\.[0-9]+\.[0-9]+$
  RELEASE_TAG_PATTERN: ^docs-v[0-9]+\.[0-9]+\.[0-9]+$
  TEMPLATE_GUIDE_MANIFEST_PATH: docs/guides/template/guide-manifest.json
  DOCUMENTATION_PROJECT: docs/TurtlePath.Template.Documentation/TurtlePath.Template.Documentation.csproj
  NUGET_OUTPUT: ./nupkgs
  NUGET_SOURCE: https://api.nuget.org/v3/index.json
  NUGET_USER: ${{ vars.NUGET_USER }}

jobs:
  validate-and-release-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Update template guide manifest
        shell: pwsh
        run: ./eng/Update-TemplateGuideManifest.ps1

      - name: Validate guide manifest is committed
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail

          if ! git diff --exit-code -- "$TEMPLATE_GUIDE_MANIFEST_PATH"; then
            echo "Template guide manifest is stale. Run eng/Update-TemplateGuideManifest.ps1 and commit the result."
            exit 1
          fi

      - name: Commit updated guide manifest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: manifest_commit
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- "$TEMPLATE_GUIDE_MANIFEST_PATH"; then
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add "$TEMPLATE_GUIDE_MANIFEST_PATH"
          git commit -m "Update template guide manifest [skip ci]"
          git push origin HEAD:main
          echo "committed=true" >> "$GITHUB_OUTPUT"

      - name: Resolve docs release marker
        id: release
        if: >
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail

          echo "should_release=false" >> "$GITHUB_OUTPUT"

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            BRANCH="${GITHUB_REF_NAME}"

            if [[ ! "$BRANCH" =~ $RELEASE_BRANCH_PATTERN ]]; then
              echo "Manual documentation releases must run from a branch matching $RELEASE_BRANCH_PATTERN. Current branch: $BRANCH"
              exit 1
            fi

            TAG="${BRANCH#"$RELEASE_BRANCH_PREFIX"}"
          else
            TEMPLATE_MARKER_CHANGED=false
            DOCS_MARKER_CHANGED=false

            if git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" | grep -qx ".template.release"; then
              TEMPLATE_MARKER_CHANGED=true
            fi

            if git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" | grep -qx "$RELEASE_MARKER_PATH"; then
              DOCS_MARKER_CHANGED=true
            fi

            if [[ "$TEMPLATE_MARKER_CHANGED" == "true" && "$DOCS_MARKER_CHANGED" != "true" ]]; then
              echo "A template release changes the template-to-guide map. Increment .docs.release and publish a new TurtlePath.Template.Documentation package in the same change."
              exit 1
            fi

            if ! git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" | grep -qx "$RELEASE_MARKER_PATH"; then
              echo "$RELEASE_MARKER_PATH did not change in this push. Skipping documentation release."
              exit 0
            fi

            if [[ ! -f "$RELEASE_MARKER_PATH" ]]; then
              echo "$RELEASE_MARKER_PATH was removed. Skipping documentation release."
              exit 0
            fi

            NON_EMPTY_LINES="$(grep -cve '^[[:space:]]*$' "$RELEASE_MARKER_PATH" || true)"
            if [[ "$NON_EMPTY_LINES" != "1" ]]; then
              echo "$RELEASE_MARKER_PATH must contain exactly one non-empty documentation release tag, for example docs-v1.0.0."
              exit 1
            fi

            TAG="$(grep -ve '^[[:space:]]*$' "$RELEASE_MARKER_PATH" | tr -d '[:space:]')"
          fi

          if [[ ! "$TAG" =~ $RELEASE_TAG_PATTERN ]]; then
            echo "Documentation release tag must match $RELEASE_TAG_PATTERN. Current value: $TAG"
            exit 1
          fi

          VERSION="${TAG#docs-v}"
          TAG_LINE=$(grep -m1 -E "^## \[($TAG|$VERSION)\]" "$CHANGELOG_PATH" || true)

          if [[ -z "$TAG_LINE" ]]; then
            echo "$CHANGELOG_PATH must contain a section for $TAG or $VERSION before releasing."
            exit 1
          fi

          echo "should_release=true" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag_line=$TAG_LINE" >> "$GITHUB_OUTPUT"

      - name: Prepare docs release notes
        if: steps.release.outputs.should_release == 'true'
        shell: bash
        run: |
          set -euo pipefail

          TAG_LINE="${{ steps.release.outputs.tag_line }}"

          awk -v tag_line="$TAG_LINE" '
            $0 == tag_line { in_section=1; next }
            in_section && /^## / { exit }
            in_section
          ' "$CHANGELOG_PATH" > "$RELEASE_NOTES_PATH"

          if [[ ! -s "$RELEASE_NOTES_PATH" ]]; then
            echo "$CHANGELOG_PATH section for ${{ steps.release.outputs.tag }} is empty."
            exit 1
          fi

      - name: Pack documentation NuGet package
        if: steps.release.outputs.should_release == 'true'
        run: >
          dotnet pack "$DOCUMENTATION_PROJECT"
          --configuration Release
          --output "$NUGET_OUTPUT"
          /p:DocumentationVersion=${{ steps.release.outputs.version }}
          /p:Version=${{ steps.release.outputs.version }}
          /p:PackageVersion=${{ steps.release.outputs.version }}

      - name: Validate NuGet trusted publishing user
        if: steps.release.outputs.should_release == 'true'
        shell: bash
        run: |
          if [[ -z "$NUGET_USER" ]]; then
            echo "NuGet publishing user is not configured."
            exit 1
          fi

      - name: NuGet trusted publishing login
        if: steps.release.outputs.should_release == 'true'
        uses: NuGet/login@v1
        id: nuget_login
        with:
          user: ${{ env.NUGET_USER }}

      - name: Create or update docs release tag
        if: steps.release.outputs.should_release == 'true'
        shell: bash
        run: |
          set -euo pipefail

          TAG="${{ steps.release.outputs.tag }}"
          HEAD_SHA="$(git rev-parse HEAD)"

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
            TAG_SHA="$(git rev-list -n 1 "$TAG")"

            if [[ "$TAG_SHA" != "$HEAD_SHA" ]]; then
              git tag --force "$TAG" "$HEAD_SHA"
              git push --force origin "refs/tags/$TAG"
            fi
          else
            git tag --force "$TAG" "$HEAD_SHA"
            git push origin "refs/tags/$TAG"
          fi

      - name: Create GitHub Documentation Release
        if: steps.release.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: TurtlePath Docs ${{ steps.release.outputs.version }}
          body_path: ${{ env.RELEASE_NOTES_PATH }}
          draft: false
          prerelease: false
          files: |
            ${{ env.TEMPLATE_GUIDE_MANIFEST_PATH }}
            ${{ env.NUGET_OUTPUT }}/TurtlePath.Template.Documentation.${{ steps.release.outputs.version }}.nupkg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push documentation to NuGet
        if: steps.release.outputs.should_release == 'true'
        shell: bash
        run: |
          set -euo pipefail
          dotnet nuget push "$NUGET_OUTPUT/TurtlePath.Template.Documentation.${{ steps.release.outputs.version }}.nupkg" \
            -k ${{ steps.nuget_login.outputs.NUGET_API_KEY }} \
            -s "$NUGET_SOURCE" --skip-duplicate
