name: Studio NuGet Release

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'app/TurtlePath.Studio.App/**'
      - 'app/TurtlePath.Studio.Abstractions/**'
      - 'app/TurtlePath.Studio.Application/**'
      - 'app/TurtlePath.Studio.Infrastructure/**'
      - 'app/TurtlePath.Studio.Updater/**'
      - 'app/TurtlePath.Studio.Package/**'
      - '.github/workflows/studio-release.yml'
      - '.studio.release'
      - 'STUDIO_CHANGELOG.md'
  push:
    branches: [main]
    paths:
      - 'app/TurtlePath.Studio.App/**'
      - 'app/TurtlePath.Studio.Abstractions/**'
      - 'app/TurtlePath.Studio.Application/**'
      - 'app/TurtlePath.Studio.Infrastructure/**'
      - 'app/TurtlePath.Studio.Updater/**'
      - 'app/TurtlePath.Studio.Package/**'
      - '.github/workflows/studio-release.yml'
      - '.studio.release'
      - 'STUDIO_CHANGELOG.md'

env:
  DOTNET_VERSION: 10.0.x
  STUDIO_VERSION_FILE: .studio.release
  STUDIO_PROJECT: app/TurtlePath.Studio.App/TurtlePath.Studio.App.csproj
  STUDIO_UPDATER_PROJECT: app/TurtlePath.Studio.Updater/TurtlePath.Studio.Updater.csproj
  STUDIO_PACKAGE_PROJECT: app/TurtlePath.Studio.Package/TurtlePath.Studio.Package.csproj
  STUDIO_TARGET_FRAMEWORK: net10.0-windows10.0.19041.0
  STUDIO_RUNTIME: win-x64
  NUGET_SOURCE: https://api.nuget.org/v3/index.json
  NUGET_USER: ${{ vars.NUGET_USER }}

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Resolve Studio version
        id: version
        shell: pwsh
        run: |
          $tag = (Get-Content $env:STUDIO_VERSION_FILE -Raw).Trim()
          if ($tag -notmatch '^studio-v\d+\.\d+\.\d+$') { throw "Invalid Studio release marker: $tag" }
          "version=$($tag.Substring(8))" >> $env:GITHUB_OUTPUT

      - name: Restore MAUI workloads
        run: dotnet workload restore "${{ env.STUDIO_PROJECT }}"

      - name: Publish Studio payload
        shell: pwsh
        run: |
          $payload = Join-Path $env:RUNNER_TEMP 'turtlepath-studio-payload'
          New-Item -ItemType Directory -Force $payload | Out-Null

          dotnet publish "${{ env.STUDIO_PROJECT }}" `
            --configuration Release `
            --framework "${{ env.STUDIO_TARGET_FRAMEWORK }}" `
            --runtime "${{ env.STUDIO_RUNTIME }}" `
            --self-contained true `
            -p:WindowsPackageType=None `
            -p:WindowsAppSDKSelfContained=true `
            -p:ApplicationDisplayVersion="${{ steps.version.outputs.version }}" `
            -p:Version="${{ steps.version.outputs.version }}" `
            -p:AssemblyVersion="${{ steps.version.outputs.version }}.0" `
            -p:FileVersion="${{ steps.version.outputs.version }}.0" `
            -p:PublishDir="$payload\"

          $updater = Join-Path $payload 'updater'
          New-Item -ItemType Directory -Force $updater | Out-Null
          dotnet publish "${{ env.STUDIO_UPDATER_PROJECT }}" `
            --configuration Release `
            --runtime "${{ env.STUDIO_RUNTIME }}" `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:PublishDir="$updater\"

          "payload=$payload" >> $env:GITHUB_OUTPUT
        id: publish

      - name: Pack Studio NuGet package
        run: >
          dotnet pack "${{ env.STUDIO_PACKAGE_PROJECT }}"
          --configuration Release
          --output "${{ runner.temp }}\studio-nupkg"
          /p:Version=${{ steps.version.outputs.version }}
          /p:PackageVersion=${{ steps.version.outputs.version }}
          /p:IncludeSymbols=false
          /p:IncludeSource=false
          /p:StudioPayloadDirectory="${{ steps.publish.outputs.payload }}"

      - name: Compress Studio payload
        shell: pwsh
        env:
          STUDIO_VERSION: ${{ steps.version.outputs.version }}
          STUDIO_PAYLOAD: ${{ steps.publish.outputs.payload }}
        run: |
          $zip = Join-Path $env:RUNNER_TEMP "TurtlePath.Studio.$env:STUDIO_VERSION.zip"
          Compress-Archive -Path (Join-Path $env:STUDIO_PAYLOAD '*') -DestinationPath $zip -CompressionLevel Optimal
          "zip=$zip" >> $env:GITHUB_OUTPUT
        id: zip

      - name: Create or update Studio release tag
        shell: pwsh
        env:
          STUDIO_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $tag = "studio-v$env:STUDIO_VERSION"
          $head = (git rev-parse HEAD).Trim()

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git tag --force $tag $head
          git push --force origin ("refs/tags/{0}" -f $tag)

          "tag=$tag" >> $env:GITHUB_OUTPUT
        id: release_tag

      - name: Create or update GitHub Studio release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: ${{ steps.release_tag.outputs.tag }}
          body: |
            TurtlePath Studio ${{ steps.version.outputs.version }}

            Install or update it with:

            ```powershell
            dotnet tool update -g TurtlePath.Studio.Tool
            turtlepath-studio update
            ```
          draft: false
          prerelease: false
          files: |
            ${{ runner.temp }}\studio-nupkg\TurtlePath.Studio.${{ steps.version.outputs.version }}.nupkg
            ${{ steps.zip.outputs.zip }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate NuGet trusted publishing user
        shell: bash
        run: test -n "$NUGET_USER"

      - name: NuGet trusted publishing login
        uses: NuGet/login@v1
        id: nuget_login
        with:
          user: ${{ env.NUGET_USER }}

      - name: Push Studio package
        shell: pwsh
        run: |
          dotnet nuget push "${{ runner.temp }}\studio-nupkg\TurtlePath.Studio.${{ steps.version.outputs.version }}.nupkg" `
            --api-key "${{ steps.nuget_login.outputs.NUGET_API_KEY }}" `
            --source "${{ env.NUGET_SOURCE }}" `
            --skip-duplicate
