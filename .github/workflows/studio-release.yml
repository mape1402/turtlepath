name: Studio Release

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'app/TurtlePath.Studio.App/**'
      - 'app/TurtlePath.Studio.Abstractions/**'
      - 'app/TurtlePath.Studio.Application/**'
      - 'app/TurtlePath.Studio.Infrastructure/**'
      - 'app/TurtlePath.Studio.Updater/**'
      - '.github/workflows/studio-release.yml'
      - '.studio.release'
      - 'STUDIO_CHANGELOG.md'
  push:
    branches:
      - main
    paths:
      - 'app/TurtlePath.Studio.App/**'
      - 'app/TurtlePath.Studio.Abstractions/**'
      - 'app/TurtlePath.Studio.Application/**'
      - 'app/TurtlePath.Studio.Infrastructure/**'
      - 'app/TurtlePath.Studio.Updater/**'
      - '.github/workflows/studio-release.yml'
      - '.studio.release'
      - 'STUDIO_CHANGELOG.md'

env:
  CONFIGURATION: Release
  DOTNET_VERSION: 10.0.x
  RELEASE_MARKER_PATH: .studio.release
  RELEASE_NOTES_PATH: studio_release_notes.txt
  RELEASE_TAG_PATTERN: ^studio-v[0-9]+\.[0-9]+\.[0-9]+$
  STUDIO_ASSET_NAME: TurtlePath.Studio.win-x64.zip
  STUDIO_MANIFEST_NAME: studio.manifest.json
  STUDIO_LATEST_TAG: studio-latest
  STUDIO_PROJECT: app/TurtlePath.Studio.App/TurtlePath.Studio.App.csproj
  STUDIO_UPDATER_PROJECT: app/TurtlePath.Studio.Updater/TurtlePath.Studio.Updater.csproj
  STUDIO_TARGET_FRAMEWORK: net10.0-windows10.0.19041.0
  STUDIO_RUNTIME: win-x64

jobs:
  build-and-release-studio:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore MAUI workloads
        run: dotnet workload restore "${{ env.STUDIO_PROJECT }}"

      - name: Restore Studio
        run: |
          dotnet restore "${{ env.STUDIO_PROJECT }}"
          dotnet restore "${{ env.STUDIO_UPDATER_PROJECT }}"

      - name: Build Studio
        run: >
          dotnet build "${{ env.STUDIO_PROJECT }}"
          --no-restore
          --configuration "${{ env.CONFIGURATION }}"
          --framework "${{ env.STUDIO_TARGET_FRAMEWORK }}"

      - name: Build Studio updater
        run: >
          dotnet build "${{ env.STUDIO_UPDATER_PROJECT }}"
          --no-restore
          --configuration "${{ env.CONFIGURATION }}"

      - name: Resolve Studio release marker
        id: release
        if: >
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail

          echo "should_release=false" >> "$GITHUB_OUTPUT"

          if [[ "${{ github.event_name }}" == "push" ]]; then
            if ! git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" | grep -qx "$RELEASE_MARKER_PATH"; then
              echo "$RELEASE_MARKER_PATH did not change in this push. Skipping Studio release."
              exit 0
            fi
          fi

          if [[ ! -f "$RELEASE_MARKER_PATH" ]]; then
            echo "$RELEASE_MARKER_PATH is required for Studio releases."
            exit 1
          fi

          NON_EMPTY_LINES="$(grep -cve '^[[:space:]]*$' "$RELEASE_MARKER_PATH" || true)"
          if [[ "$NON_EMPTY_LINES" != "1" ]]; then
            echo "$RELEASE_MARKER_PATH must contain exactly one non-empty Studio release tag, for example studio-v1.0.0."
            exit 1
          fi

          TAG="$(grep -ve '^[[:space:]]*$' "$RELEASE_MARKER_PATH" | tr -d '[:space:]')"
          if [[ ! "$TAG" =~ $RELEASE_TAG_PATTERN ]]; then
            echo "Studio release tag must match $RELEASE_TAG_PATTERN. Current value: $TAG"
            exit 1
          fi

          VERSION="${TAG#studio-v}"
          echo "should_release=true" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish Studio
        if: steps.release.outputs.should_release == 'true'
        shell: pwsh
        run: |
          $publishDirectory = Join-Path $env:RUNNER_TEMP "turtlepath-studio-publish"
          New-Item -ItemType Directory -Force $publishDirectory | Out-Null

          dotnet publish "${{ env.STUDIO_PROJECT }}" `
            --configuration "${{ env.CONFIGURATION }}" `
            --framework "${{ env.STUDIO_TARGET_FRAMEWORK }}" `
            --runtime "${{ env.STUDIO_RUNTIME }}" `
            --self-contained true `
            -p:WindowsPackageType=None `
            -p:WindowsAppSDKSelfContained=true `
            -p:ApplicationDisplayVersion="${{ steps.release.outputs.version }}" `
            -p:Version="${{ steps.release.outputs.version }}" `
            -p:AssemblyVersion="${{ steps.release.outputs.version }}.0" `
            -p:FileVersion="${{ steps.release.outputs.version }}.0" `
            -p:PublishDir="$publishDirectory/"

          $updaterDirectory = Join-Path $publishDirectory "updater"
          New-Item -ItemType Directory -Force $updaterDirectory | Out-Null
          dotnet publish "${{ env.STUDIO_UPDATER_PROJECT }}" `
            --configuration "${{ env.CONFIGURATION }}" `
            --self-contained true `
            --runtime "${{ env.STUDIO_RUNTIME }}" `
            -p:PublishSingleFile=true `
            -p:PublishDir="$updaterDirectory/"

          $assetPath = Join-Path $env:RUNNER_TEMP "${{ env.STUDIO_ASSET_NAME }}"
          if (Test-Path $assetPath) {
            Remove-Item $assetPath -Force
          }

          Compress-Archive -Path (Join-Path $publishDirectory '*') -DestinationPath $assetPath -Force
          $hash = (Get-FileHash -Path $assetPath -Algorithm SHA256).Hash.ToLowerInvariant()
          $assetSize = (Get-Item $assetPath).Length
          $manifestPath = Join-Path $env:RUNNER_TEMP "${{ env.STUDIO_MANIFEST_NAME }}"
          $manifest = [ordered]@{
            channel = "stable"
            latestVersion = "${{ steps.release.outputs.version }}"
            minimumSupportedVersion = "1.0.0"
            releaseNotesUrl = "https://github.com/${{ github.repository }}/releases/tag/${{ steps.release.outputs.tag }}"
            packages = @(
              [ordered]@{
                platform = "${{ env.STUDIO_RUNTIME }}"
                url = "https://github.com/${{ github.repository }}/releases/download/${{ steps.release.outputs.tag }}/${{ env.STUDIO_ASSET_NAME }}"
                sha256 = $hash
                size = $assetSize
              }
            )
          }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content -Path $manifestPath -Encoding utf8

          "asset_path=$assetPath" >> $env:GITHUB_OUTPUT
          "manifest_path=$manifestPath" >> $env:GITHUB_OUTPUT
        id: publish

      - name: Prepare Studio release notes
        if: steps.release.outputs.should_release == 'true'
        shell: pwsh
        run: |
          @"
          TurtlePath Studio ${{ steps.release.outputs.version }}

          Asset:
          - ${{ env.STUDIO_ASSET_NAME }}
          - ${{ env.STUDIO_MANIFEST_NAME }}

          Changelog:
          - https://github.com/${{ github.repository }}/blob/main/STUDIO_CHANGELOG.md

          Usage:
          1. Download the zip.
          2. Extract it.
          3. Run TurtlePath.Studio.App.exe.
          "@ | Set-Content -Path "${{ env.RELEASE_NOTES_PATH }}" -Encoding utf8

      - name: Create or update Studio release tag
        if: steps.release.outputs.should_release == 'true'
        shell: bash
        run: |
          set -euo pipefail

          TAG="${{ steps.release.outputs.tag }}"
          HEAD_SHA="$(git rev-parse HEAD)"

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
            TAG_SHA="$(git rev-list -n 1 "$TAG")"

            if [[ "$TAG_SHA" != "$HEAD_SHA" ]]; then
              git tag --force "$TAG" "$HEAD_SHA"
              git push --force origin "refs/tags/$TAG"
            fi
          else
            git tag --force "$TAG" "$HEAD_SHA"
            git push origin "refs/tags/$TAG"
          fi

      - name: Create GitHub Release
        if: steps.release.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: TurtlePath Studio ${{ steps.release.outputs.version }}
          body_path: ${{ env.RELEASE_NOTES_PATH }}
          draft: false
          prerelease: false
          files: |
            ${{ steps.publish.outputs.asset_path }}
            ${{ steps.publish.outputs.manifest_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create or update Studio latest tag
        if: steps.release.outputs.should_release == 'true'
        shell: bash
        run: |
          set -euo pipefail

          TAG="${{ env.STUDIO_LATEST_TAG }}"
          HEAD_SHA="$(git rev-parse HEAD)"

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag --force "$TAG" "$HEAD_SHA"
          git push --force origin "refs/tags/$TAG"

      - name: Create GitHub Studio latest release
        if: steps.release.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.STUDIO_LATEST_TAG }}
          name: TurtlePath Studio Latest
          body_path: ${{ env.RELEASE_NOTES_PATH }}
          draft: false
          prerelease: false
          make_latest: false
          overwrite_files: true
          files: |
            ${{ steps.publish.outputs.asset_path }}
            ${{ steps.publish.outputs.manifest_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
