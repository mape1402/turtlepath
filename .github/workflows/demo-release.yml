name: Demo Template Release

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'demos/TurtlePath.Template.HeroesShowcase/**'
      - '.github/workflows/demo-release.yml'
      - '.demo.release'
      - 'DEMO_CHANGELOG.md'
  push:
    branches:
      - main
    paths:
      - 'demos/TurtlePath.Template.HeroesShowcase/**'
      - '.github/workflows/demo-release.yml'
      - '.demo.release'
      - 'DEMO_CHANGELOG.md'

env:
  CHANGELOG_PATH: DEMO_CHANGELOG.md
  CONFIGURATION: Release
  DOTNET_VERSION: 10.0.x
  DEMO_INFO_PATH: demos/TurtlePath.Template.HeroesShowcase/templates/turtlepath-heroes-showcase/.template.config/template.json
  DEMO_PROJECT: demos/TurtlePath.Template.HeroesShowcase/TurtlePath.Template.HeroesShowcase.csproj
  DEMO_SOLUTION: demos/TurtlePath.Template.HeroesShowcase/templates/turtlepath-heroes-showcase/Heroes.Service.sln
  NUGET_OUTPUT: ./nupkgs
  NUGET_SOURCE: https://api.nuget.org/v3/index.json
  NUGET_USER: ${{ vars.NUGET_USER }}
  RELEASE_BRANCH_PREFIX: demo-releases/
  RELEASE_MARKER_PATH: .demo.release
  RELEASE_NOTES_PATH: demo_release_notes.txt
  RELEASE_BRANCH_PATTERN: ^demo-releases/demo-v[0-9]+\.[0-9]+\.[0-9]+$
  RELEASE_TAG_PATTERN: ^demo-v[0-9]+\.[0-9]+\.[0-9]+$

jobs:
  build-and-release-demo-template:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore generated demo solution
        run: dotnet restore "$DEMO_SOLUTION"

      - name: Build generated demo solution
        run: dotnet build "$DEMO_SOLUTION" --no-restore --configuration "$CONFIGURATION"

      - name: Test generated demo solution
        run: dotnet test "$DEMO_SOLUTION" --no-build --configuration "$CONFIGURATION" --verbosity normal

      - name: Resolve demo release marker
        id: release
        if: >
          (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail

          echo "should_release=false" >> "$GITHUB_OUTPUT"

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            BRANCH="${GITHUB_REF_NAME}"

            if [[ ! "$BRANCH" =~ $RELEASE_BRANCH_PATTERN ]]; then
              echo "Manual demo releases must run from a branch matching $RELEASE_BRANCH_PATTERN. Current branch: $BRANCH"
              exit 1
            fi

            TAG="${BRANCH#"$RELEASE_BRANCH_PREFIX"}"
          else
            if ! git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" | grep -qx "$RELEASE_MARKER_PATH"; then
              echo "$RELEASE_MARKER_PATH did not change in this push. Skipping demo release."
              exit 0
            fi

            if [[ ! -f "$RELEASE_MARKER_PATH" ]]; then
              echo "$RELEASE_MARKER_PATH was removed. Skipping demo release."
              exit 0
            fi

            NON_EMPTY_LINES="$(grep -cve '^[[:space:]]*$' "$RELEASE_MARKER_PATH" || true)"
            if [[ "$NON_EMPTY_LINES" != "1" ]]; then
              echo "$RELEASE_MARKER_PATH must contain exactly one non-empty demo release tag, for example demo-v1.0.0."
              exit 1
            fi

            TAG="$(grep -ve '^[[:space:]]*$' "$RELEASE_MARKER_PATH" | tr -d '[:space:]')"
          fi

          if [[ ! "$TAG" =~ $RELEASE_TAG_PATTERN ]]; then
            echo "Demo release tag must match $RELEASE_TAG_PATTERN. Current value: $TAG"
            exit 1
          fi

          VERSION="${TAG#demo-v}"
          TAG_LINE=$(grep -m1 -E "^## \[($TAG|$VERSION)\]" "$CHANGELOG_PATH" || true)

          if [[ -z "$TAG_LINE" ]]; then
            echo "$CHANGELOG_PATH must contain a section for $TAG or $VERSION before releasing."
            exit 1
          fi

          BRANCH="$RELEASE_BRANCH_PREFIX$TAG"

          echo "should_release=true" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "tag_line=$TAG_LINE" >> "$GITHUB_OUTPUT"

      - name: Create demo release branch
        if: steps.release.outputs.should_release == 'true' && github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail

          BRANCH="${{ steps.release.outputs.branch }}"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "Demo release branch $BRANCH already exists. Skipping creation."
            exit 0
          fi

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git branch "$BRANCH" "${{ github.sha }}"
          git push origin "refs/heads/$BRANCH"

      - name: Prepare demo release notes
        if: steps.release.outputs.should_release == 'true'
        shell: bash
        run: |
          set -euo pipefail

          TAG_LINE="${{ steps.release.outputs.tag_line }}"

          awk -v tag_line="$TAG_LINE" '
            $0 == tag_line { in_section=1; next }
            in_section && /^## / { exit }
            in_section
          ' "$CHANGELOG_PATH" > "$RELEASE_NOTES_PATH"

          if [[ ! -s "$RELEASE_NOTES_PATH" ]]; then
            echo "$CHANGELOG_PATH section for ${{ steps.release.outputs.tag }} is empty."
            exit 1
          fi

      - name: Stamp demo template version
        if: steps.release.outputs.should_release == 'true'
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f "$DEMO_INFO_PATH" ]]; then
            echo "$DEMO_INFO_PATH was not found."
            exit 1
          fi

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(os.environ["DEMO_INFO_PATH"])
          version = "${{ steps.release.outputs.version }}"
          document = json.loads(path.read_text(encoding="utf-8"))
          document["version"] = version
          path.write_text(json.dumps(document, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Pack demo template NuGet package
        if: steps.release.outputs.should_release == 'true'
        run: >
          dotnet pack "$DEMO_PROJECT"
          --configuration "$CONFIGURATION"
          --output "$NUGET_OUTPUT"
          /p:Version=${{ steps.release.outputs.version }}
          /p:PackageVersion=${{ steps.release.outputs.version }}
          /p:MinVerVersionOverride=${{ steps.release.outputs.version }}

      - name: Create or update demo release tag
        if: steps.release.outputs.should_release == 'true'
        shell: bash
        run: |
          set -euo pipefail

          TAG="${{ steps.release.outputs.tag }}"
          HEAD_SHA="$(git rev-parse HEAD)"

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
            TAG_SHA="$(git rev-list -n 1 "$TAG")"

            if [[ "$TAG_SHA" != "$HEAD_SHA" ]]; then
              git tag --force "$TAG" "$HEAD_SHA"
              git push --force origin "refs/tags/$TAG"
            fi
          else
            git tag --force "$TAG" "$HEAD_SHA"
            git push origin "refs/tags/$TAG"
          fi

      - name: Create GitHub Demo Release
        if: steps.release.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: TurtlePath.Template.HeroesShowcase ${{ steps.release.outputs.version }}
          body_path: ${{ env.RELEASE_NOTES_PATH }}
          draft: false
          prerelease: false
          files: |
            ${{ env.NUGET_OUTPUT }}/*.nupkg
            ${{ env.NUGET_OUTPUT }}/*.snupkg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate NuGet trusted publishing user
        if: steps.release.outputs.should_release == 'true'
        shell: bash
        run: |
          if [[ -z "$NUGET_USER" ]]; then
            echo "NuGet publishing user is not configured."
            exit 1
          fi

      - name: NuGet trusted publishing login
        if: steps.release.outputs.should_release == 'true'
        uses: NuGet/login@v1
        id: nuget_login
        with:
          user: ${{ env.NUGET_USER }}

      - name: Push demo template to NuGet
        if: steps.release.outputs.should_release == 'true'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          packages=("$NUGET_OUTPUT"/TurtlePath.Template.HeroesShowcase.*.nupkg)
          symbols=("$NUGET_OUTPUT"/TurtlePath.Template.HeroesShowcase.*.snupkg)

          if (( ${#packages[@]} == 0 )); then
            echo "No TurtlePath.Template.HeroesShowcase .nupkg files were found in $NUGET_OUTPUT."
            exit 1
          fi

          for package in "${packages[@]}"; do
            dotnet nuget push "$package" -k ${{ steps.nuget_login.outputs.NUGET_API_KEY }} -s "$NUGET_SOURCE" --skip-duplicate
          done

          for symbol in "${symbols[@]}"; do
            dotnet nuget push "$symbol" -k ${{ steps.nuget_login.outputs.NUGET_API_KEY }} -s "$NUGET_SOURCE" --skip-duplicate
          done
